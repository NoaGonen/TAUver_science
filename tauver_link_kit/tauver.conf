# TAUVER Link Kit settings for THIS machine.
# Change them with:  tv set <name> <value>   (tv set domain 27 · tv set jetson_ip 192.168.27.10 ...)

# Must be the SAME number on every machine, or they can't see each other.
TAUVER_DOMAIN_ID=27

# Where "tv jetson", "tv push" and "tv sshkey" go. 192.168.55.1 = the Jetson over a USB-C cable.
JETSON_IP=192.168.55.1
# Your login name on the Jetson (the one chosen at its first boot).
JETSON_USER=

# The other machine's IP, so "tv doctor" can ping it.
PEER_IP=
